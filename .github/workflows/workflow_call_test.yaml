---
name: test (workflow_call)
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
permissions: {}
jobs:
  release:
    uses: suzuki-shunsuke/js-action-release-workflow/.github/workflows/release.yaml@89c0f9f455f977a280103a7f450573adac9d8cf6 # v0.0.1
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    with:
      version: pr/${{github.event.pull_request.number}}
      pr: ${{github.event.pull_request.number}}

  # Test the action built by the release job
  test-action:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    needs: release
    permissions:
      contents: write # To update the pull request branch
      pull-requests: write # To update the pull request branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{needs.release.outputs.sha}}
          persist-credentials: false
      # The action built by the release job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # The token of pull requests from forks can't update branches
      - uses: ./
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          pr_number: ${{github.event.pull_request.number}}
          files: |
            foo

  test-workflow:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@51ece8dcaabff59820bfb2053c56e3cb281cf7b2 # v0.0.1
    with:
      aqua_version: v2.64.0
    permissions:
      contents: read
      pull-requests: read
